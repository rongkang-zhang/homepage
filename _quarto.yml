date: last-modified

execute:
  echo: true
  eval: true        # 关键：让过滤器（diagram 等）真正执行
  freeze: auto                # 若代码未变，直接复用上次的输出
  cache: true                 # 单元级缓存，CI 更快

project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"

