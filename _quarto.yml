date: last-modified

execute:
  echo: true
  eval: true        # 关键：让过滤器（diagram 等）真正执行
  freeze: auto                # 若代码未变，直接复用上次的输出
  cache: true                 # 单元级缓存，CI 更快

project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"

website:
  title: "Rong-Kang<br>Zhang"
  site-url: "https://rongkang-zhang.github.io/homepage/"
  favicon: assets/pictures/web-logo-7.png
  description: >
    Higher Category Theory,
    Grothendieck Toposes,
    Chiral Representation Theory,
    Holographic Entanglement Entropy
  issue-url: https://github.com/rongkang-zhang/homepage/issues/new?labels=page-feedback&template=page_report.md
  twitter-card: true
  open-graph: true
  image: assets/pictures/profile-picture.png
  # ==========  3. GA + GDPR 横幅  ==========
  google-analytics: "G-DDVX87V0F2" # ← 改为你自己的 GA4 测量 ID
  cookie-consent: true
  navbar:
    logo: "assets/pictures/web-logo-7.png"
    logo-alt: "Site logo"
    logo-href: "/"                     # 点击 logo 回到首页
    background: "#023a75ff"
    foreground: "#ffffffff"
    left:
      - text: Expository<br>Notes&nbsp;<small>▼</small>
        icon: "bi-file-earmark-text"
        menu:
            - text: Overview
              href: expository-notes/index.html
            - text: Category theory
              href: expository-notes/category-theory/index.html
      - text: Extemporaneous<br>Talks&nbsp;<small>▼</small>
        icon: "bi-lightning"
        menu:
            - text: Overview
              href: extemporaneous-talks/index.html
            - text: Category theory
              href: extemporaneous-talks/category-theory/index.html
      - text: Self-Worked<br>Solutions&nbsp;<small>▼</small>
        icon: "bi-pencil-square"
        menu:
            - text: Overview
              href: solutions/index.html
            - text: Category theory
              href: solutions/category-theory/index.html
      - text: CodeLab&nbsp;<small>▼</small>
        icon: "bi-code-slash"
        menu:
            - text: Overview
              href: codelab/index.html
            - text: Category theory
              href: codelab/category-theory/index.html
      - text: Research&nbsp;<small>▼</small>
        icon: "bi-infinity"
        menu:
            - text: Overview
              href: research/index.html
            - text: 1 - 20251110-Now<br>A Topos-Theoretic Bridge for<br>Holographic Entanglement Entropy
              href: research/1/index.html
      - text: Conferences
        icon: "bi-calendar-event"
        href: conferences/index.html
  page-footer:
    left: |
      <img src="/assets/pictures/web-logo-7.png" alt="Site logo" height="24" style="vertical-align:middle; margin-right:0.5em;">
      Made with [Quarto](https://quarto.org/) and managed via [Git](https://git-scm.com/) & [GitHub Desktop](https://desktop.github.com/).<br>
      © 2025 Rong-Kang Zhang · Last updated: {{< meta date >}} ·
      <a href="/cookie-policy.html">Cookie Policy</a> ·
      <a href="javascript:window.CookieConsentApi.showDialog()">Change cookie preferences</a>

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark:  [darkly, custom.scss]
    toc: true
    code-overflow: wrap       # 长代码自动折行，避免横向滚动条
    link-external-newwindow: true # 外链默认新标签打开
    linkcolor: blue
    font-awesome: true
    html-math-method:
      method: mathjax
      url: "https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.2/MathJax.js?config=TeX-AMS-MML_HTMLorMML"
    filters:
      - E:/apps-in-use/github-desktop/rongkang-zhang/homepage/_extensions/quarto-ext/latex-environment/latex-environment.lua
      - E:/apps-in-use/github-desktop/rongkang-zhang/homepage/_extensions/pandoc-ext/diagram/diagram.lua
      - E:/apps-in-use/github-desktop/rongkang-zhang/homepage/_extensions/danmackinlay/tikz/tikz.lua
      - E:/apps-in-use/github-desktop/rongkang-zhang/homepage/_extensions/quarto-ext/include-code-files/include-code-files.lua